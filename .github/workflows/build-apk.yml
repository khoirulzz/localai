name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone llama.cpp (for native build)
        run: |
          git clone --depth 1 --branch b4600 https://github.com/ggerganov/llama.cpp.git inference/llamacpp/src/main/cpp/llama.cpp
          # Fallback if tag missing
          if [ ! -f inference/llamacpp/src/main/cpp/llama.cpp/CMakeLists.txt ]; then
            rm -rf inference/llamacpp/src/main/cpp/llama.cpp
            git clone --depth 1 https://github.com/ggerganov/llama.cpp.git inference/llamacpp/src/main/cpp/llama.cpp
          fi
          ls inference/llamacpp/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.injected.build.abi=arm64-v8a 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|CMake Error|undefined reference" -A2 build.log | head -40 > err.txt || true
          echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt | cut -c1-3500)"

      - name: Lokasi APK
        run: |
          echo "::notice title=APK::$(find app/build -name '*.apk' 2>/dev/null | tr '\n' ' ') | $(ls app/build/outputs 2>&1 | tr '\n' ' ')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: List APK info
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;
