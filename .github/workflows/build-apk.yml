name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone llama.cpp (for native build)
        env:
          # Tag di-pin: API C llama.cpp sering berubah, jadi jangan ikut master.
          LLAMA_CPP_TAG: b11854
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git inference/llamacpp/src/main/cpp/llama.cpp
          test -f inference/llamacpp/src/main/cpp/llama.cpp/CMakeLists.txt
          test -f inference/llamacpp/src/main/cpp/llama.cpp/tools/mtmd/CMakeLists.txt

      - name: Build offline image runtime (stable-diffusion.cpp arm64)
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git image-native
          git -C image-native checkout 0886f11b6b8b4d1f6259e0f1337cae554284c37a
          git -C image-native submodule update --init --recursive
          cmake -S image-native -B image-native-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_BUILD_SHARED_GGML_LIB=OFF -DGGML_OPENMP=OFF
          cmake --build image-native-build --target sd-cli -j 4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp image-native-build/bin/sd-cli app/src/main/jniLibs/arm64-v8a/libsdcli.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|CMake Error|undefined reference" -A2 build.log | head -40 > err.txt || true
          echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt | cut -c1-3500)"

      - name: Lokasi APK
        run: |
          echo "::notice title=APK::$(find app/build -name '*.apk' 2>/dev/null | tr '\n' ' ') | $(ls app/build/outputs 2>&1 | tr '\n' ' ')"

      - name: Package update ZIP
        run: |
          zip -j Nalaro-AI-v0.4.4-Long-Answers-APK.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            Nalaro-AI-v0.4.4-Long-Answers-APK.zip
          if-no-files-found: error
          retention-days: 14

      - name: List APK info
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk local-ai-debug.apk
          gh release create "build-${{ github.run_number }}" local-ai-debug.apk Nalaro-AI-v0.4.4-Long-Answers-APK.zip \
            --title "Debug build #${{ github.run_number }}" \
            --notes "Debug APK (arm64-v8a), commit ${{ github.sha }}" --prerelease
