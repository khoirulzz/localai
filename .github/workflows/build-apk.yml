name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          sdkmanager --licenses || true

      - name: Clone llama.cpp (for native build)
        run: |
          git clone --depth 1 --branch b4600 https://github.com/ggerganov/llama.cpp.git inference/llamacpp/src/main/cpp/llama.cpp
          # Fallback if tag missing
          if [ ! -f inference/llamacpp/src/main/cpp/llama.cpp/CMakeLists.txt ]; then
            rm -rf inference/llamacpp/src/main/cpp/llama.cpp
            git clone --depth 1 https://github.com/ggerganov/llama.cpp.git inference/llamacpp/src/main/cpp/llama.cpp
          fi
          ls inference/llamacpp/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: List APK info
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;
